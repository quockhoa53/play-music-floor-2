# Render Blueprint: https://render.com/docs/blueprint-spec
# Tự động deploy lên Render khi GitHub Actions (CI) chạy pass trên nhánh main.
services:
  - type: web
    name: play-music-floor-2
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --limit-concurrency 200 --timeout-keep-alive 5
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Keep-alive tự động đánh thức server (mỗi 8 phút) & giữ thức các service Render khác
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: APP_SERVER_PUBLIC_URL
        value: https://play-music-floor-2.onrender.com
      - key: KEEP_ALIVE_EXTRA_URLS
        sync: false
      # Chống tấn công DDoS tầng ứng dụng (L7)
      - key: DDOS_GUARD_ENABLED
        value: "true"
      # Cách 1 (Khuyên dùng): Chuỗi kết nối Postgres Pooler từ Supabase (tự động tạo bảng)
      - key: DATABASE_URL
        sync: false
      # Cách 2 (Tuỳ chọn): Dùng Supabase REST API (cần chạy supabase_schema.sql 1 lần)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Tuỳ chọn: proxy dân dụng nếu YouTube chặn IP datacenter cho luồng audio fallback
      - key: YT_PROXY
        sync: false
      # --- Em bé floor 2 (AI) ---
      # Groq API keys: hoặc GROQ_API_KEYS (cách nhau bởi dấu phẩy), hoặc mỗi key 1 biến GROQ_API_KEY_1.._20
      # (dùng được cả 2, key trùng tự bỏ). Mỗi key nên ở 1 tổ chức Groq KHÁC NHAU: hạn mức free tính theo tổ chức
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      # Giọng MC: ElevenLabs (nhanh, giống người thật). Gói Free chỉ dùng được giọng premade -> Jessica.
      # Hết credit / lỗi -> tự chuyển sang Edge HoaiMy -> chỉ hiện chữ (không dùng giọng robot Google)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "cgSgspJ2msm6clMCkdW9"
      # 1 = agent gpt-oss (công cụ, tra cứu, thêm bài); 0 = chỉ dùng pipeline Qwen cũ
      - key: AI_AGENT_ENABLED
        value: "1"
      # Phòng mới mặc định bật chế độ Em bé chủ động (chào người mới, nhắc lịch...). Host vẫn tắt được
      - key: AI_PROACTIVE_DEFAULT
        value: "1"
      # Giây giữ thành viên khi rớt kết nối KHÔNG kèm lệnh rời (đổi tab, tab bị trình duyệt đóng băng, mạng chập chờn).
      # Rời thật = bấm Rời phòng / đóng tab (gửi beacon). 21600 = 6 tiếng: chỉ dọn thiết bị biến mất (sập nguồn, crash)
      - key: LEAVE_GRACE_SEC
        value: "21600"
      # Bí mật để băm định danh thiết bị -> profile trí nhớ. ĐẶT 1 LẦN, đổi về sau = mọi người mất trí nhớ AI
      - key: PROFILE_ID_PEPPER
        sync: false
      # Token xem /api/admin/ai-metrics (header X-Admin-Token). Bỏ trống = tắt endpoint
      - key: ADMIN_TOKEN
        sync: false
